<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <title>DAS :: 공지사항</title>  

  <meta property="og:title" content="아르코예술기록원">
  <meta property="og:description" content="아르코예술기록원, 한국예술디지털아카이브, 한국근현대예술사 구술채록사업, 공연영상화사업, 예술 아카이빙 교육사업, 원 테이블">
  <meta name="description" content="아르코예술기록원, 한국예술디지털아카이브, 한국근현대예술사 구술채록사업, 공연영상화사업, 예술 아카이빙 교육사업, 원 테이블">

  <!-- css -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-gov-dynamic-subset.min.css" />

  <link rel="stylesheet" href="../assets/css/lib/jquery-ui.min.css">
  <link rel="stylesheet" href="../assets/css/das_common.css">
  
  <!-- js -->
  <script src="../assets/js/lib/jquery.js"></script>
  <script src="../assets/js/lib/jquery-ui.min.js"></script>
  <script src="../assets/js/das_ui_script.js"></script>

  <!-- 퍼블전용 js :: 사용금지 -->
  <script src="../guide/js/include.js"></script>
</head>
<body>
  <div class="das-wrapper">
    <header id="dasHeaderInclude"><!-- Header Includ 영역 :: 퍼블 전용 사용금지 --></header>

    <div class="das-container">
      <aside id="dasLnbInclude1"><!-- Lnb Includ 영역 :: 퍼블 전용 사용금지 --></aside>

      <div class="das-contents-wrap"> 
        <div class="open-pages">
          <ul>
            <li><button type="button" class="btn-page-open">대시보드 홈</button></li>
            <li class="active">
              <button type="button" class="btn-page-open">공지사항</button>
              <button type="button" class="btn-page-close"><span class="sr-only">닫기</span></button>
            </li>
          </ul>
        </div>

        <div class="das-contents">
          <section class="contents">
            <div class="conts-head">
              <div class="breadcrumb">
                <ol>
                  <li>사이트 관리</li>
                  <li>안내·지원센터</li>
                  <li>공지사항</li>
                </ol>
              </div>
              <h2 class="h2-title">공지사항</h2>
            </div>
            <div class="conts-body">
              <div class="view-head">
                <button type="button" class="btn-default"><i class="ico14-prev"></i>목록</button>
                <h3 class="h3-title">공지사항 [상세]</h3>
              </div>

              <div class="row-table">
                <table>
                  <colgroup>
                    <col style="width: 120px;">
                    <col>
                  </colgroup>
                  <tbody>
                    <tr>
                      <th scope="row">
                        <span class="required-mark">*</span> 공지유형
                      </th>
                      <td>
                        <span class="das-radio">
                          <input type="radio" name="dasRadioNotiType" id="dasRadioNotiType1">
                          <label for="dasRadioNotiType1">공지</label>
                        </span>   
                        <span class="das-radio">
                          <input type="radio" name="dasRadioNotiType" id="dasRadioNotiType2">
                          <label for="dasRadioNotiType2">안내</label>
                        </span> 
                        <span class="das-radio">
                          <input type="radio" name="dasRadioNotiType" id="dasRadioNotiType3" checked>
                          <label for="dasRadioNotiType3">점검</label>
                        </span> 
                        <span class="das-radio">
                          <input type="radio" name="dasRadioNotiType" id="dasRadioNotiType4" >
                          <label for="dasRadioNotiType4">기타</label>
                        </span> 
                      </td>
                    </tr>
                    <tr>
                      <th scope="row">
                        <span class="required-mark">*</span>
                        <label for="dasInputDate1">게시기간</label>
                      </th>
                      <td colspan="5">
                        <input type="text" class="das-input-date" id="dasInputDate1" value="2025-09-12">
                        ~
                        <input type="text" class="das-input-date" id="dasInputDate2" value="2025-09-12">
                        <span class="das-checkbox ml-medium">
                          <input type="checkbox" name="dasCheckbox1" id="dasCheckbox1">
                          <label for="dasCheckbox1">상시</label>
                        </span>   
                      </td>
                    </tr>
                    <tr>
                      <th scope="row">
                        <span class="required-mark">*</span>
                        <label for="dasInputSubject">제목</label>
                      </th>
                      <td>
                        <input type="text" class="das-input-text block" id="dasInputSubject" value="[공지] 장비교체 작업으로 인한 접속 일시단절 안내 6월 26일(월) 11:00~13:00">
                      </td>
                    </tr>
                    <tr>
                      <th scope="row">
                        <span class="required-mark">*</span> 
                        <label for="dasTextareaConts">내용</label>
                      </th>
                      <td>
                        <textarea class="das-textarea block" id="dasTextareaConts" rows="5"></textarea>
                      </td>
                    </tr>
                    <tr>
                      <th scope="row">첨부파일</th>
                      <td>
                        <div class="attach-file">
                          <div class="file-find">
                            <input type="file" id="dasfileFind" hidden>
                            <label for="dasfileFind">
                              <i class="ico22-clip"></i>                          
                            </label>                              
                          </div>
                          <dl>
                            <dt>이미지 파일을 드래그 하거나 클릭하여 파일을 선택하세요.</dt>
                            <dd>권장 사이즈 : 1920*780px / 파일형식 : JPG, PNG / 최대용량 : 5MB</dd>
                          </dl>
                        </div>
                        <ul class="file-list">
                          <li>
                            <span class="das-badge-doc img">JPG</span>
                            <div class="file__item">
                              <p class="name">원시트1.jpg</p>
                              <p class="info">
                                <span>2.4MB</span>
                                <button type="button" class="btn-text-danger">삭제</button>
                              </p>
                            </div>
                          </li>
                        </ul>
                      </td>
                    </tr>
                    <tr>
                      <th scope="row">
                        <span class="required-mark">*</span> 상단고정
                      </th>
                      <td>
                        <span class="das-radio">
                          <input type="radio" name="dasRadio1" id="dasRadio1" checked>
                          <label for="dasRadio1">사용</label>
                        </span>   
                        <span class="das-radio">
                          <input type="radio" name="dasRadio1" id="dasRadio1_1">
                          <label for="dasRadio1_1">미사용</label>
                        </span> 
                      </td>
                    </tr>
                    <tr>
                      <th scope="row">
                        <span class="required-mark">*</span> 상태
                      </th>
                      <td>
                        <span class="das-radio">
                          <input type="radio" name="dasRadioRelease" id="dasRadioRelease1" checked>
                          <label for="dasRadioRelease1">공개</label>
                        </span>   
                        <span class="das-radio">
                          <input type="radio" name="dasRadioRelease" id="dasRadioRelease2">
                          <label for="dasRadioRelease2">비공개</label>
                        </span> 
                      </td>
                    </tr>
                    <tr>
                      <th scope="row">조회수</th>
                      <td>100</td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <section class="lower-sec">
                <div class="lower-title-area">
                  <h4 class="h4-title">운영정보</h4>
                </div>

                <div class="row-table">
                  <table>
                    <colgroup>
                      <col style="width: 120px;">
                      <col style="width: auto;">
                      <col style="width: 120px;">
                      <col style="width: auto;">
                      <col style="width: 120px;">
                      <col style="width: auto;">
                    </colgroup>
                    <tbody>
                      <tr>
                        <th scope="row">등록일</th>
                        <td>2025-10-28</td>
                        <th scope="row">수정일</th>
                        <td>2025-10-28</td>
                        <th scope="row">작성자</th>
                        <td>admin@arko.or.kr</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </section>

              <div class="das-cta-btns">
                <div class="left">
                  <button type="button" class="btn-cta-default"><i class="ico14-prev"></i>목록</button>
                  <button type="button" class="btn-cta-default">다시쓰기</button>
                  <button type="button" class="btn-cta-primary"><i class="ico14-save"></i>저장</button>
                </div>
                <div class="right">
                  <button type="button" class="btn-cta-danger"><i class="ico14-del"></i>삭제</button>
                </div>
              </div>
            </div><!-- //conts-body -->
          </section>
        </div>

        <footer id="dasFooterInclude"><!-- Footer Includ 영역 :: 퍼블 전용 사용금지 --></footer>
      </div>
    </div><!-- //das-container -->
  </div>

  <script>
    $(function () {
      // 공통 옵션
      const dateOptions = {
        dateFormat: 'yy-mm-dd',
        firstDay: 0,
        showOtherMonths: true,
        selectOtherMonths: false,
        minDate: 0,
        changeMonth: true,
        changeYear: true,
        yearRange: 'c-10:c+10',
        dayNamesMin: ['일', '월', '화', '수', '목', '금', '토'],
        monthNames: ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'],
        monthNamesShort: ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월']
      };

      // 시작일
      $('#dasInputDate1').datepicker({
        ...dateOptions,
        onSelect: function (date) {
          $('#dasInputDate2').datepicker('option', 'minDate', date);
        }
      });

      // 종료일
      $('#dasInputDate2').datepicker({
        ...dateOptions,
        onSelect: function (date) {
          $('#dasInputDate1').datepicker('option', 'maxDate', date);
        }
      });
    });

    $('.das-contents').on('scroll', function () {
      $('.hasDatepicker').datepicker('widget').hide();
    });
  </script>
</body>
</html>
