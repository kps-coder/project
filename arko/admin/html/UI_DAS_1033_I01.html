<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <title>DAS :: 주요 아카이브 관리</title>  

  <meta property="og:title" content="아르코예술기록원">
  <meta property="og:description" content="아르코예술기록원, 한국예술디지털아카이브, 한국근현대예술사 구술채록사업, 공연영상화사업, 예술 아카이빙 교육사업, 원 테이블">
  <meta name="description" content="아르코예술기록원, 한국예술디지털아카이브, 한국근현대예술사 구술채록사업, 공연영상화사업, 예술 아카이빙 교육사업, 원 테이블">

  <!-- css -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-gov-dynamic-subset.min.css" />

  <link rel="stylesheet" href="../assets/css/lib/jquery-ui.min.css">
  <link rel="stylesheet" href="../assets/css/das_common.css">
  
  <!-- js -->
  <script src="../assets/js/lib/jquery.js"></script>
  <script src="../assets/js/lib/jquery-ui.min.js"></script>
  <script src="../assets/js/das_ui_script.js"></script>

  <!-- 퍼블전용 js :: 사용금지 -->
  <script src="../guide/js/include.js"></script>
</head>
<body>
  <div class="das-wrapper">
    <header id="dasHeaderInclude"><!-- Header Includ 영역 :: 퍼블 전용 사용금지 --></header>

    <div class="das-container">
      <aside id="dasLnbInclude1"><!-- Lnb Includ 영역 :: 퍼블 전용 사용금지 --></aside>

      <div class="das-contents-wrap"> 
        <div class="open-pages">
          <ul>
            <li><button type="button" class="btn-page-open">대시보드 홈</button></li>
            <li class="active">
              <button type="button" class="btn-page-open">주요 아카이브 관리</button>
              <button type="button" class="btn-page-close"><span class="sr-only">닫기</span></button>
            </li>
          </ul>
        </div>

        <div class="das-contents">
          <section class="contents">
            <div class="conts-head">
              <div class="breadcrumb">
                <ol>
                  <li>사이트 관리</li>
                  <li>메인화면관리</li>
                  <li>주요 아카이브 관리</li>
                </ol>
              </div>
              <h2 class="h2-title">주요 아카이브 관리</h2>
            </div>
            <div class="conts-body">
              <div class="view-head">
                <button type="button" class="btn-default"><i class="ico14-prev"></i>목록</button>
                <h3 class="h3-title">주요 아카이브 관리 [등록]</h3>
              </div>

              <div class="row-table">
                <table>
                  <colgroup>
                    <col style="width: 137px;">
                    <col style="width: 120px;">
                    <col>
                  </colgroup>
                  <tbody>
                    <tr>
                      <th scope="row" rowspan="3">
                        <img src="../assets/img/img_none.png" alt="이미지없음" class="archive-img">
                      </th>
                      <th scope="row">
                        <span class="required-mark">*</span> 
                        <label for="dasInputGenre1">장르</label>
                      </th>
                      <td>
                        <select class="das-select" id="dasInputGenre1">
                          <option>전체</option>
                          <option>예술일반</option>
                          <option>문학</option>
                          <option>시각예술</option>
                          <option>연극·뮤지컬</option>
                          <option>무용</option>
                          <option>음악</option>
                          <option>예술종합</option>
                          <option>예술정책</option>
                          <option>기타</option>
                          <option>다원예술</option>
                        </select>
                        <button type="button" class="btn-secondary green">기록물 불러오기</button>
                        <span class="sub-text ml-xsmall">장르를 선택 후 기록물 불러오기를 선택하세요.</span>
                      </td>
                    </tr>
                    <tr>
                      <th scope="row">
                        <span class="required-mark">*</span> 
                        <label for="dasInputRecords">기록물명</label>
                      </th>
                      <td>
                        <input type="text" class="das-input-text block" id="dasInputRecords" value="">
                      </td>
                    </tr>
                    <tr>
                      <th scope="row">
                        <label for="dasInputCollectionName">컬렉션명</label>
                      </th>
                      <td>
                        <input type="text" class="das-input-text block" id="dasInputCollectionName" value="">
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <section class="lower-sec">
                <div class="lower-title-area">
                  <h4 class="h4-title">등록정보</h4>
                </div>

                <div class="row-table">
                  <table>
                    <colgroup>
                      <col style="width: 120px;">
                      <col style="width: auto;">
                    </colgroup>
                    <tbody>
                      <tr>
                        <th scope="row">
                          <span class="required-mark">*</span>
                          <label for="dasRadio1">적용방식</label>
                        </th>
                        <td>
                          <span class="das-radio">
                            <input type="radio" name="dasRadio2" id="dasRadio2" checked>
                            <label for="dasRadio2">기존 컬렉션 사용</label>
                          </span>   
                          <span class="das-radio">
                            <input type="radio" name="dasRadio2" id="dasRadio3_1">
                            <label for="dasRadio3_1">컬렉션 정보 수정하여 등록</label>
                          </span>  
                          <span class="sub-text ml-medium">※ '컬렉션 정보 수정하여 등록' 선택 시, 원본과 무관하게 아래 직접 입력한 정보로 노출됩니다.</span>
                        </td>
                      </tr>
                      <tr>
                        <th scope="row">
                          <span class="required-mark">*</span>
                          <label for="dasInputCategory">카테고리</label>
                        </th>
                        <td>
                          <input type="text" class="das-input-text block" id="dasInputCategory" value="">
                        </td>
                      </tr>
                      <tr>
                        <th scope="row">
                          <span class="required-mark">*</span>
                          <label for="dasInputRecords2">기록물명</label>
                        </th>
                        <td>
                          <input type="text" class="das-input-text block" id="dasInputRecords2" value="">
                        </td>
                      </tr>
                      <tr>
                        <th scope="row">
                          <span class="required-mark">*</span>
                          <label for="dasInputCollection2">컬렉션명</label>
                        </th>
                        <td>
                          <input type="text" class="das-input-text block" id="dasInputCollection2" value="">
                        </td>
                      </tr>
                      <tr>
                        <th scope="row">
                          <span class="required-mark">*</span>
                          <label for="dasInputRecordsURL">기록물 URL</label>
                        </th>
                        <td>
                          <input type="text" class="das-input-text block" id="dasInputRecordsURL" value="">
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </section>

              <section class="lower-sec">
                <div class="lower-title-area">
                  <h4 class="h4-title">운영정보</h4>
                </div>

                <div class="row-table">
                  <table>
                    <colgroup>
                      <col style="width: 120px;">
                      <col style="width: auto;">
                      <col style="width: 120px;">
                      <col style="width: auto;">
                      <col style="width: 120px;">
                      <col style="width: auto;">
                    </colgroup>
                    <tbody>
                      <tr>
                        <th scope="row">
                          <span class="required-mark">*</span>
                          <label for="dasRadio1">상태</label>
                        </th>
                        <td colspan="5">
                          <span class="das-radio">
                            <input type="radio" name="dasRadio1" id="dasRadio1" checked>
                            <label for="dasRadio1">공개</label>
                          </span>   
                          <span class="das-radio">
                            <input type="radio" name="dasRadio1" id="dasRadio1_1">
                            <label for="dasRadio1_1">비공개</label>
                          </span>  
                        </td>
                      </tr>
                      <tr>
                        <th scope="row">
                          <span class="required-mark">*</span>
                          <label for="dasInputRanking">공개순서</label>
                        </th>
                        <td colspan="5">
                          <input type="text" class="das-input-text" id="dasInputRanking" value="">
                        </td>
                      </tr>
                      <tr>
                        <th scope="row">
                          <span class="required-mark">*</span>
                          <label for="dasInputDate1">게시기간</label>
                        </th>
                        <td colspan="5">
                          <input type="text" class="das-input-date" id="dasInputDate1" value="">
                          ~
                          <input type="text" class="das-input-date" id="dasInputDate2" value="">
                          <span class="das-checkbox ml-medium">
                            <input type="checkbox" name="dasCheckbox1" id="dasCheckbox1">
                            <label for="dasCheckbox1">상시</label>
                          </span>   
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </section>

              <div class="das-cta-btns">
                <div class="left">
                  <button type="button" class="btn-cta-default"><i class="ico14-prev"></i>목록</button>
                  <button type="button" class="btn-cta-default">다시쓰기</button>
                  <button type="button" class="btn-cta-primary"><i class="ico14-save"></i>저장</button>
                </div>
              </div>
            </div><!-- //conts-body -->
          </section>
        </div>

        <footer id="dasFooterInclude"><!-- Footer Includ 영역 :: 퍼블 전용 사용금지 --></footer>
      </div>
    </div><!-- //das-container -->
  </div>
  <script>
    $(function () {
      // 공통 옵션
      const dateOptions = {
        dateFormat: 'yy-mm-dd',
        firstDay: 0,
        showOtherMonths: true,
        selectOtherMonths: false,
        minDate: 0,
        changeMonth: true,
        changeYear: true,
        yearRange: 'c-10:c+10',
        dayNamesMin: ['일', '월', '화', '수', '목', '금', '토'],
        monthNames: ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'],
        monthNamesShort: ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월']
      };

      // 시작일
      $('#dasInputDate1').datepicker({
        ...dateOptions,
        onSelect: function (date) {
          $('#dasInputDate2').datepicker('option', 'minDate', date);
        }
      });

      // 종료일
      $('#dasInputDate2').datepicker({
        ...dateOptions,
        onSelect: function (date) {
          $('#dasInputDate1').datepicker('option', 'maxDate', date);
        }
      });
    });
  </script>
</body>
</html>
