<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <title>DAS :: 기록물 조회 및 선택 팝업</title>  

  <meta property="og:title" content="아르코예술기록원">
  <meta property="og:description" content="아르코예술기록원, 한국예술디지털아카이브, 한국근현대예술사 구술채록사업, 공연영상화사업, 예술 아카이빙 교육사업, 원 테이블">
  <meta name="description" content="아르코예술기록원, 한국예술디지털아카이브, 한국근현대예술사 구술채록사업, 공연영상화사업, 예술 아카이빙 교육사업, 원 테이블">

  <!-- css -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-gov-dynamic-subset.min.css" />

  <link rel="stylesheet" href="../assets/css/lib/jquery-ui.min.css">
  <link rel="stylesheet" href="../assets/css/das_common.css">
  
  <!-- js -->
  <script src="../assets/js/lib/jquery.js"></script>
  <script src="../assets/js/lib/jquery-ui.min.js"></script>
  <script src="../assets/js/das_ui_script.js"></script>

  <!-- 퍼블전용 js :: 사용금지 -->
  <script src="../guide/js/include.js"></script>
</head>
<body>
  <button type="button" class="btn-secondary" onclick="modalCtrl.modalOpen('modalAlertWarning')">필수값 입력 안내</button>
  <button type="button" class="btn-primary" onclick="modalCtrl.modalOpen('modalAlertWarningCollection')">컬렉션 선택 안내</button>
  <button type="button" class="btn-secondary" onclick="modalCtrl.modalOpen('modalAlertWarningRelease')">공개순서 중복 안내</button>
  <button type="button" class="btn-primary" onclick="modalCtrl.modalOpen('modalAlertSuccessFinish')">등록 완료 안내</button>
  <button type="button" class="btn-secondary" onclick="modalCtrl.modalOpen('modalAlertSuccessEdit')">수정 완료 안내</button>
  <button type="button" class="btn-primary" onclick="modalCtrl.modalOpen('modalAlertWarningReset')">다시쓰기 안내</button>
  <button type="button" class="btn-secondary" onclick="modalCtrl.modalOpen('modalAlertErorrImage')">이미지 업로드 안내</button>
  <button type="button" class="btn-primary" onclick="modalCtrl.modalOpen('modalAlertInfoLinkage')">연계 기록물 해제 안내</button>
  <button type="button" class="btn-secondary" onclick="modalCtrl.modalOpen('modalAlertErrorDel')">기획 콘텐츠 삭제 안내</button>

  <!-- modal -->
   <!-- 필수값 입력 안내 -->
  <div class="das-modal" id="modalAlertWarning">
    <section class="das-modal-wrap alert">
      <div class="das-modal-body">
        <div class="modal-alert-msg">
          <i class="ico38-alert-warning"></i>
          <p class="text">${항목명}을(를) 입력해주세요.</p>
        </div>        
      </div><!-- //das-modal-body -->   
      <div class="das-modal-foot">
        <button type="button" class="btn-primary" onclick="modalCtrl.modalClose('modalAlertWarning');">확인</button>
      </div>
    </section>
  </div>

  <!-- 컬렉션 선택 안내 -->
  <div class="das-modal" id="modalAlertWarningCollection">
    <section class="das-modal-wrap alert">
      <div class="das-modal-body">
        <div class="modal-alert-msg">
          <i class="ico38-alert-warning"></i>
          <p class="text">컬렉션을 선택해주세요.</p>
        </div>        
      </div><!-- //das-modal-body -->   
      <div class="das-modal-foot">
        <button type="button" class="btn-default" onclick="modalCtrl.modalClose('modalAlertWarningCollection');">취소</button>
        <button type="button" class="btn-primary" onclick="modalCtrl.modalClose('modalAlertWarningCollection');">확인</button>
      </div>
    </section>
  </div>

  <!-- 공개순서 중복 안내 -->
  <div class="das-modal" id="modalAlertWarningRelease">
    <section class="das-modal-wrap alert">
      <div class="das-modal-body">
        <div class="modal-alert-msg">
          <i class="ico38-alert-warning"></i>
          <p class="text">이미 사용 중인 공개순서입니다.<br>다른 순서를 입력해주세요.</p>
        </div>        
      </div><!-- //das-modal-body -->   
      <div class="das-modal-foot">
        <button type="button" class="btn-default" onclick="modalCtrl.modalClose('modalAlertWarningRelease');">취소</button>
        <button type="button" class="btn-primary" onclick="modalCtrl.modalClose('modalAlertWarningRelease');">확인</button>
      </div>
    </section>
  </div>

  <!-- 등록 완료 안내 -->
  <div class="das-modal" id="modalAlertSuccessFinish">
    <section class="das-modal-wrap alert">
      <div class="das-modal-body">
        <div class="modal-alert-msg">
          <i class="ico38-alert-success"></i>
          <p class="text">기획 콘텐츠가 등록되었습니다.</p>
        </div>        
      </div><!-- //das-modal-body -->   
      <div class="das-modal-foot">
        <button type="button" class="btn-primary" onclick="modalCtrl.modalClose('modalAlertSuccessFinish');">확인</button>
      </div>
    </section>
  </div>

  <!-- 수정 완료 안내 -->
  <div class="das-modal" id="modalAlertSuccessEdit">
    <section class="das-modal-wrap alert">
      <div class="das-modal-body">
        <div class="modal-alert-msg">
          <i class="ico38-alert-success"></i>
          <p class="text">기획 콘텐츠가 수정되었습니다.</p>
        </div>        
      </div><!-- //das-modal-body -->   
      <div class="das-modal-foot">
        <button type="button" class="btn-default" onclick="modalCtrl.modalClose('modalAlertSuccessEdit');">취소</button>
        <button type="button" class="btn-primary" onclick="modalCtrl.modalClose('modalAlertSuccessEdit');">확인</button>
      </div>
    </section>
  </div>

  <!-- 다시쓰기 안내 -->
  <div class="das-modal" id="modalAlertWarningReset">
    <section class="das-modal-wrap alert">
      <div class="das-modal-body">
        <div class="modal-alert-msg">
          <i class="ico38-alert-warning"></i>
          <p class="text">입력된 내용이 모두 초기화됩니다.<br>계속 진행하시겠습니까?</p>
        </div>        
      </div><!-- //das-modal-body -->   
      <div class="das-modal-foot">
        <button type="button" class="btn-default" onclick="modalCtrl.modalClose('modalAlertWarningReset');">취소</button>
        <button type="button" class="btn-primary" onclick="modalCtrl.modalClose('modalAlertWarningReset');">확인</button>
      </div>
    </section>
  </div>

  <!-- 이미지 업로드 안내 -->
  <div class="das-modal" id="modalAlertErorrImage">
    <section class="das-modal-wrap alert">
      <div class="das-modal-body">
        <div class="modal-alert-msg">
          <i class="ico38-alert-warning"></i>
          <p class="text">JPG, PNG 파일만 등록 가능하며<br>최대 5MB까지 업로드할 수 있습니다.</p>
        </div>        
      </div><!-- //das-modal-body -->   
      <div class="das-modal-foot">
        <button type="button" class="btn-default" onclick="modalCtrl.modalClose('modalAlertErorrImage');">취소</button>
        <button type="button" class="btn-primary" onclick="modalCtrl.modalClose('modalAlertErorrImage');">확인</button>
      </div>
    </section>
  </div>

  <!-- 연계 기록물 해제 안내 -->
  <div class="das-modal" id="modalAlertInfoLinkage">
    <section class="das-modal-wrap alert">
      <div class="das-modal-body">
        <div class="modal-alert-msg">
          <i class="ico38-alert-info"></i>
          <p class="text">선택한 기록물의 연계를 해제하시겠습니까?</p>
        </div>        
      </div><!-- //das-modal-body -->   
      <div class="das-modal-foot">
        <button type="button" class="btn-primary" onclick="modalCtrl.modalClose('modalAlertInfoLinkage');">확인</button>
      </div>
    </section>
  </div>

  <!-- 기획 콘텐츠 삭제 안내 -->
  <div class="das-modal" id="modalAlertErrorDel">
    <section class="das-modal-wrap alert">
      <div class="das-modal-body">
        <div class="modal-alert-msg">
          <i class="ico38-alert-error"></i>
          <p class="text">기획 콘텐츠를 삭제하시겠습니까?</p>
        </div>        
      </div><!-- //das-modal-body -->   
      <div class="das-modal-foot">
        <button type="button" class="btn-primary" onclick="modalCtrl.modalClose('modalAlertErrorDel');">확인</button>
      </div>
    </section>
  </div>

</body>
</html>
