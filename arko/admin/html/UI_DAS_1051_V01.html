                    <tr>

                            </div>
                          </li>
                          <li>
                            <span class="das-badge-doc hwp">HWP</span>
                            <div class="file__item">
                              <p class="name">원시트1.hwp</p>
                              <p class="info">

                    <tr>
                      <th scope="row">
                        <span class="required-mark">*</span> 
                        <label for="dasTextareaConts">상세내용</label>
                      </th>
                      <td>
                        <textarea class="das-textarea block" id="dasTextareaConts" rows="5">한국문화예술위원회 아르코예술기록원은 베니스비엔날레 한국관 컬렉션을 주제로 «원 테이블: 7. PAPER TO SPACE, 한국관»을 선보인다. 한국관 컬렉션은 1995년 베니스 자르디니 공원에 마지막으로 신설된 국가관인 한국관의 건립과 운영 기록으로 구축되었다.
 한국문화예술위원회는 한국관을 지었고 개관 이래 전시와 공간을 운영해 왔으며, 2022~2023년 공동 설계자 프랑코 만쿠조(Franco Mancuso)가 설계 기록 전량을 기증하면서 건물이 형성되는 과정을 보여주는 기록이 컬렉션에 더해졌다. 컬렉션은 서울과 베니스를 오간 팩스와 스케치, 인허가 행정문서, 도면과 모형, 시공 계약 서류, 현장 사진 등 약 2,200건의 기록물로 구성되어 있다.</textarea>
                      </td>

                    <tr>

  <script>
    $(function () {
      // 공통 옵션
      const dateOptions = {
        dateFormat: 'yy-mm-dd',
        firstDay: 0,
        showOtherMonths: true,
        selectOtherMonths: false,
        minDate: 0,
        changeMonth: true,
        changeYear: true,
        yearRange: 'c-10:c+10',
        dayNamesMin: ['일', '월', '화', '수', '목', '금', '토'],
        monthNames: ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'],
        monthNamesShort: ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월']
      };

      // 시작일
      $('#dasInputDate1').datepicker({
        ...dateOptions,
        onSelect: function (date) {
          $('#dasInputDate2').datepicker('option', 'minDate', date);
        }
      });

      // 종료일
      $('#dasInputDate2').datepicker({
        ...dateOptions,
        onSelect: function (date) {
          $('#dasInputDate1').datepicker('option', 'maxDate', date);
        }
      });
    });

    $('.das-contents').on('scroll', function () {
      $('.hasDatepicker').datepicker('widget').hide();
    });
  </script>
