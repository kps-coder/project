<!DOCTYPE html>

  <meta name="description" content="아르코예술기록원, 한국예술디지털아카이브, 한국근현대예술사 구술채록사업, 공연영상화사업, 예술 아카이빙 교육사업, 원 테이블">

  <!-- css -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-gov-dynamic-subset.min.css" />

  <link rel="stylesheet" href="../assets/css/lib/jquery-ui.min.css">
  <link rel="stylesheet" href="../assets/css/das_common.css">
  
  <!-- js -->
  <script src="../assets/js/lib/jquery.js"></script>
  <script src="../assets/js/lib/jquery-ui.min.js"></script>
  <script src="../assets/js/das_ui_script.js"></script>

  <!-- 퍼블전용 js :: 사용금지 -->
  <script src="../guide/js/include.js"></script>
</head>
<body>
  <div class="das-wrapper">
    <header id="dasHeaderInclude"><!-- Header Includ 영역 :: 퍼블 전용 사용금지 --></header>

    <div class="das-container">
      <aside id="dasLnbInclude1"><!-- Lnb Includ 영역 :: 퍼블 전용 사용금지 --></aside>

      <div class="das-contents-wrap"> 
        <div class="open-pages">
          <ul>
            <li><button type="button" class="btn-page-open">대시보드 홈</button></li>
            <li class="active">
              <button type="button" class="btn-page-open">Hero 영역 관리</button>
              <button type="button" class="btn-page-close"><span class="sr-only">닫기</span></button>
            </li>
          </ul>
        </div>

        <div class="das-contents">
          <section class="contents">
            <div class="conts-head">
              <div class="breadcrumb">
                <ol>
                  <li>사이트 관리</li>
                  <li>메인화면관리</li>
                  <li>Hero 영역 관리</li>
                </ol>
              </div>
              <h2 class="h2-title">Hero 영역 관리</h2>
            </div>
            <div class="conts-body">
              <div class="view-head">
                <button type="button" class="btn-default"><i class="ico14-prev"></i>목록</button>
                <h3 class="h3-title">Hero 영역 관리 [상세]</h3>
              </div>

              <div class="row-table">
                <table>
                  <colgroup>
                    <col style="width: 120px;">
                    <col>
                  </colgroup>
                  <tbody>
                    <tr>
                      <th scope="row">
                        <span class="required-mark">*</span> 
                        <label for="dasInputName">제목</label>
                      </th>
                      <td>
                        <input type="text" class="das-input-text block" id="dasInputName" value="메인이미지">
                      </td>
                    </tr>
                    <tr>
                      <th scope="row">
                        <span class="required-mark">*</span> 
                        <label for="dasinputURL">링크URL</label>
                      </th>
                      <td>
                        <input type="text" class="das-input-text block" id="dasinputURL" value="https://artsarchive.arko.or.kr/guide/notice/4617">
                      </td>
                    </tr>
                    <tr>
                      <th scope="row">
                        <span class="required-mark">*</span> 
                        <label for="dasInputName">이미지</label>
                      </th>
                      <td>
                        <div class="image-preview">
                          <div class="image-preview__img">
                            <img src="../assets/img/img_sample.png" alt="">
                          </div>
                          <div class="image-preview__info">
                            <dl>
                              <dt>파일명</dt>
                              <dd>hero_20260901.png</dd>
                            </dl>
                            <dl>
                              <dt>이미지 크기</dt>
                              <dd>1920 * 780 px</dd>
                            </dl>
                            <dl>
                              <dt>파일 용량</dt>
                              <dd>1.24 MB</dd>
                            </dl>
                            <dl>
                              <dt>파일 형식</dt>
                              <dd>
                                <span class="das-badge-doc img">PNG</span>
                              </dd>
                            </dl>
                          </div>
                        </div>
                        <div class="noti-box">
                          <i class="ico14-noti"></i>
                          <p>권장 이미지 크기 : 1920*780px / 파일형식 : JPG, PNG / 최대용량 : 5MB</p>
                        </div>
                        <div class="image-alt-input">
                          <dl>
                            <dt>이미지 대체 텍스트</dt>
                            <dd>
                              <input type="text" class="das-input-text block">
                            </dd>
                          </dl>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <section class="lower-sec">
                <div class="lower-title-area">
                  <h4 class="h4-title">운영정보</h4>
                </div>

                <div class="row-table">
                  <table>
                    <colgroup>
                      <col style="width: 120px;">
                      <col style="width: auto;">
                      <col style="width: 120px;">
                      <col style="width: auto;">
                      <col style="width: 120px;">
                      <col style="width: auto;">
                    </colgroup>
                    <tbody>
                      <tr>
                        <th scope="row">
                          <span class="required-mark">*</span>
                          <label for="dasRadio1">상태</label>
                        </th>
                        <td colspan="5">
                          <span class="das-radio">
                            <input type="radio" name="dasRadio1" id="dasRadio1" checked>
                            <label for="dasRadio1">공개</label>
                          </span>   
                          <span class="das-radio">
                            <input type="radio" name="dasRadio1" id="dasRadio1_1">
                            <label for="dasRadio1_1">비공개</label>
                          </span>  
                        </td>
                      </tr>
                      <tr>
                        <th scope="row">
                          <span class="required-mark">*</span>
                          <label for="dasInputRanking">공개순서</label>
                        </th>
                        <td colspan="5">
                          <input type="text" class="das-input-text" id="dasInputRanking" value="1">
                        </td>
                      </tr>
                      <tr>
                        <th scope="row">
                          <span class="required-mark">*</span>
                          <label for="dasInputDate1">게시기간</label>
                        </th>
                        <td colspan="5">
                          <input type="text" class="das-input-date" id="dasInputDate1" value="2026-08-01">
                          ~
                          <input type="text" class="das-input-date" id="dasInputDate2" value="2026-08-01">
                          <span class="das-checkbox ml-medium">
                            <input type="checkbox" name="dasCheckbox1" id="dasCheckbox1">
                            <label for="dasCheckbox1">상시</label>
                          </span>   
                        </td>
                      </tr>
                      <tr>
                        <th scope="row">등록일</th>
                        <td>2026-08-23</td>
                        <th scope="row">수정일</th>
                        <td>2026-08-23</td>
                        <th scope="row">수정자</th>
                        <td>admin@arko.or.kr</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </section>

              <div class="das-cta-btns">
                <div class="left">
                  <button type="button" class="btn-cta-default"><i class="ico14-prev"></i>목록</button>
                  <button type="button" class="btn-cta-default">다시쓰기</button>
                  <button type="button" class="btn-cta-primary"><i class="ico14-save"></i>저장</button>
                </div>
              </div>
            </div><!-- //conts-body -->
          </section>
        </div>

        <footer id="dasFooterInclude"><!-- Footer Includ 영역 :: 퍼블 전용 사용금지 --></footer>
