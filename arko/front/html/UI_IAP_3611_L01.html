  <script>
    const buttons = document.querySelectorAll('.arko-board-type button');
    const board = document.querySelector('.arko-toggle-board');
    const btnFilter = document.querySelector('.btn-filter');
    const btnFilterOff = document.querySelector('.sch-detail-off-btn');
    const searchDetail = document.querySelector('.sch-detail');

    buttons.forEach(button => {
      button.addEventListener('click', () => {
        const type = button.dataset.toggleType;

        // 버튼 active 변경
        buttons.forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');

        // 게시판 타입 변경
        board.classList.remove('toggle--list', 'toggle--thum');
        board.classList.add(`toggle--${type}`);
      });
    });

    // 모바일 시 필터 열기
    btnFilter.addEventListener('click', () => {
      searchDetail.classList.add('open');

      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';

      requestAnimationFrame(() => {
        searchDetail.focus();
      });
    });

    // 모바일 시 필터 닫기
    btnFilterOff.addEventListener('click', () => {
      searchDetail.classList.remove('open');

      document.documentElement.style.overflow = '';
      document.body.style.overflow = '';

      btnFilter.focus();
    });

    // 기간 선택
    $(function () {
      const $slider = $('#periodSlider');
      const $start = $('#periodStart');
      const $end = $('#periodEnd');

      const MIN = 1900;
      const MAX = 2026;


      /* --------------------------------
        Slider 생성
      -------------------------------- */

      $slider.slider({

        range: true,

        min: MIN,
        max: MAX,

        step: 1,

        values: [
          Number($start.val()),
          Number($end.val())
        ],

        slide: function (event, ui) {

          // Slider → Input
          $start.val(ui.values[0]);
          $end.val(ui.values[1]);

          updateTooltip(ui.values);
        },

        change: function (event, ui) {

          // Slider → Input
          $start.val(ui.values[0]);
          $end.val(ui.values[1]);

          updateTooltip(ui.values);
        },

        create: function () {

          const values = $(this).slider('values');

          updateTooltip(values);
        }

      });


      /* --------------------------------
        Tooltip
      -------------------------------- */

      function updateTooltip(values) {

        const $handles = $slider.find('.ui-slider-handle');

        $handles.eq(0).attr('data-value', values[0]);
        $handles.eq(1).attr('data-value', values[1]);
      }


      /* --------------------------------
        Input → Slider
      -------------------------------- */

      $start.on('change', function () {

        let start = parseInt($(this).val(), 10);
        let end = $slider.slider('values', 1);


        // 숫자가 아니면 기존 값 유지
        if (isNaN(start)) {
          start = $slider.slider('values', 0);
        }


        // 범위 제한
        start = Math.max(MIN, Math.min(start, MAX));


        // 시작값이 종료값보다 클 수 없음
        if (start > end) {
          start = end;
        }


        $(this).val(start);

        $slider.slider('values', 0, start);
      });


      $end.on('change', function () {

        let start = $slider.slider('values', 0);
        let end = parseInt($(this).val(), 10);


        // 숫자가 아니면 기존 값 유지
        if (isNaN(end)) {
          end = $slider.slider('values', 1);
        }


        // 범위 제한
        end = Math.max(MIN, Math.min(end, MAX));


        // 종료값이 시작값보다 작을 수 없음
        if (end < start) {
          end = start;
        }


        $(this).val(end);

        $slider.slider('values', 1, end);
      });


      /* --------------------------------
        입력 중 숫자만 허용
      -------------------------------- */

      $start.add($end).on('input', function () {

        this.value = this.value.replace(/[^0-9]/g, '');
      });

    });
  </script>
