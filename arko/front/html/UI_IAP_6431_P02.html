<body>
  <button type="button" class="krds-btn medium primary open-modal" data-target="modalCopySource">출처 복사</button>

  <!-- modal -->

  <section id="modalCopySource" class="krds-modal fade" role="dialog" aria-labelledby="tit_modalCopySource">
    <div class="modal-dialog modal-md">
      <div class="modal-content">
        <!-- modal title -->
        <div class="modal-header">

              <div class="krds-form-check">

              </div>
              <div class="krds-form-check">
                <input type="radio" name="rdo_1" id="rdo_2">
                <label for="rdo_2">간략형</label>
              </div>
              <div class="krds-form-check">
                <input type="radio" name="rdo_1" id="rdo_3">

              </div>
            </div>
          </section>
          <section class="sec-cont">
            <h3 class="h3-title">서지정보 미리보기</h3>   
            <div class="copy-source-preview">
              (글) 권인철 등 다수, 「나의 백남준 : 기억, 보존, 확산」, 2023, 단행본, 680.99 권68ㄴ, 한국문화예술위원회 아르코예술기록원 제공.
            </div>
          </section>
        </div>
        <!-- //modal contents -->
        <!-- modal btn -->
        <div class="modal-btn btn-wrap">
          <button type="button" class="krds-btn medium primary close-modal">적용</button>
        </div>
        <!-- //modal btn -->
        <!-- close button -->
        <button type="button" class="krds-btn medium icon btn-close close-modal">
          <span class="sr-only">닫기</span>
          <i class="svg-icon ico-popup-close"></i>
        </button>
        <!-- //close button -->
      </div>
    </div>
    <div class="modal-back in"></div>
  </section>
  <!-- //modal -->


  <!-- 퍼블전용:: include용 사용금지 -->
  <script src="../guide/js/include.js"></script>

  <!-- UI js -->
