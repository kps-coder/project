  <meta name="description" content="아르코예술기록원, 한국예술디지털아카이브, 한국근현대예술사 구술채록사업, 공연영상화사업, 예술 아카이빙 교육사업, 원 테이블">

  <!-- css -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-gov-dynamic-subset.min.css" />

  <link rel="stylesheet" href="../assets/css/lib/jquery-ui.min.css">
  <link rel="stylesheet" href="../assets/krds/css/common/common.css">
  <link rel="stylesheet" href="../assets/krds/css/component/component.css">

</head>
<body>
  <div class="input-group">
    <input type="text" id="reservationDateInput" class="krds-input small" value="" disabled style="max-width: 30rem;">
    <button type="button" class="krds-btn small tertiary open-modal" data-target="modalVisitInfo">선택</button>
  </div>

  <!-- modal -->
  <!-- 방문예약정보 선택 -->
  <section id="modalVisitInfo" class="krds-modal fade" role="dialog" aria-labelledby="tit_modalVisitInfo">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <!-- modal title -->
        <div class="modal-header">
          <h2 id="tit_modalVisitInfo" class="modal-title">방문예약정보 선택</h2>
        </div>
        <!-- //modal title -->
        <!-- modal contents -->
        <div class="modal-conts">
          <div class="reservation-calendar">
            <div class="calr-legend">
              <div class="closed-days"><span class="mark"></span>휴관일</div>
            </div>
            <div id="reservationCalendar"></div>
          </div>
          <div class="block-table-area">
            <div class="block-table">
              <dl>
                <dt>열람장소</dt>
                <dd>
                  <div class="radio-btn-group j-center">
                    <span class="radio-btn">
                      <input type="radio" name="rdo_btn1" id="rdo_btn1_all">
                      <label for="rdo_btn1_all">보존자료열람실A</label>
                    </span>
                    <span class="radio-btn">
                      <input type="radio" name="rdo_btn1" id="rdo_btn1_1">
                      <label for="rdo_btn1_1">보존자료열람실B</label>
                    </span>
                    <span class="radio-btn">
                      <input type="radio" name="rdo_btn1" id="rdo_btn1_2">
                      <label for="rdo_btn1_2">공동감상석(2인이상)</label>
                    </span>
                  </div>
                </dd>
              </dl>
              <dl>
                <dt>방문시간</dt>
                <dd>
                  <div class="visit-time-area">
                    <div class="visit-time">
                      <div class="time-field">
                        <label for="startTime">시작시간</label>
                        <select id="startTime" class="krds-form-select medium" title="선택">
                          <option value="">10:00</option>
                        </select>
                      </div>
                      <span class="time-separator" aria-hidden="true">~</span>
                      <div class="time-field">
                        <label for="endTime">종료시간</label>
                        <select id="endTime" class="krds-form-select medium" title="선택">
                          <option value="">10:00</option>
                        </select>
                      </div>
                    </div>
                    <p class="mt-medium">※ 이용시간은 1시간 단위로 선택할 수 있습니다.</p>
                  </div>                  
                </dd>
              </dl>
              <dl>
                <dt>예약인원</dt>
                <dd>
                  <div class="quantity-toggle-area">
                    <div class="quantity-toggle">
                      <button type="button" class="count-plus-btn" data-step="1" aria-label="인원 증가">+</button>
                      <div class="quantity-toggle__input">
                        <input type="number" id="personCount" value="1" min="1" max="10" aria-label="예약 인원수">
                        <span aria-hidden="true">명</span>
                      </div>
                      <button type="button" class="count-minus-btn" data-step="-1" aria-label="인원 감소">-</button>                      
                    </div>
                    <p>공동감상석 선택 시 최소 2명 이상 입력해야 합니다.</p>
                  </div>                  
                </dd>
              </dl>
            </div>
            <div class="reservation-select-check">
              <dl>
                <dt>선택정보</dt>
                <dd>
                  <span>2026.08.27</span> / 
                  <span>보존자료열람실A</span> / 
                  <span>10:00~11:00</span> / 
                  <span>2명</span>
                </dd>
              </dl>
            </div>
          </div>
        </div>
        <!-- //modal contents -->
        <!-- modal btn -->
        <div class="modal-btn btn-wrap">
          <button type="button" class="krds-btn medium primary close-modal">적용</button>
          <button type="button" class="krds-btn medium tertiary close-modal">취소</button>
        </div>
        <!-- //modal btn -->
        <!-- close button -->
        <!-- <button type="button" class="krds-btn medium icon btn-close close-modal">
          <span class="sr-only">닫기</span>
          <i class="svg-icon ico-popup-close"></i>
        </button> -->
        <!-- //close button -->
      </div>
    </div>
    <div class="modal-back in"></div>
  </section>
  <!-- //modal -->

  <!-- 퍼블전용:: include용 사용금지 -->
  <script src="../guide/js/include.js"></script>

  <!-- UI js -->
  <script src="../assets/krds/js/component/ui-script.js"></script> <!-- krds 제공 스크립트 -->
  <script src="../assets/js/arko-ui-script.js"></script> <!-- arko 전용 ui 스크립트 -->

  <script>
    const modalBtn = document.querySelector('.krds-btn');
    
    setTimeout(function(){
      modalBtn.click();
    }, 100);

    $(function () {
      const $calendar = $('#reservationCalendar');

      $calendar.datepicker({
        dateFormat: 'yy.mm.dd',
        firstDay: 0,
        showOtherMonths: true,
        selectOtherMonths: false,
        minDate: 0,
        defaultDate: new Date(),
        showMonthAfterYear: true,
        yearSuffix: ".", 
        monthNamesSuffix: "",

        // 요일 한글 표시
        dayNames: [
          '일요일', '월요일', '화요일', '수요일',
          '목요일', '금요일', '토요일'
        ],
        dayNamesMin: [
          '일요일', '월요일', '화요일', '수요일',
          '목요일', '금요일', '토요일'
        ],
        dayNamesShort: ['일', '월', '화', '수', '목', '금', '토'],

        // 월 표시
        monthNames: [
          '01', '02', '03', '04', '05', '06',
          '07', '08', '09', '10', '11', '12'
        ],
        monthNamesShort: [
          '01', '02', '03', '04', '05', '06',
          '07', '08', '09', '10', '11', '12'
        ],
        // 월 변경 시 제목 갱신
        onChangeMonthYear: function (year, month) {
               
        },
        beforeShowDay: function (date) {
          const day = date.getDay();

          // 일요일(0), 토요일(6) 비활성화
          if (day === 0 || day === 6) {
            return [false, 'weekend-disabled', '휴관일'];
          }
          return [true, '', ''];
        },
      });

      function setCalendarNavigationFocus() {
        const $next = $('#reservationCalendar .ui-datepicker-next');
        const $prev = $('#reservationCalendar .ui-datepicker-prev');

        $next.attr({
          'href': '#n',
          'aria-label': '다음 달'
        });

        $prev.attr({
          'href': '#n',
          'aria-label': '이전 달'
        });
      }

      setCalendarNavigationFocus();

      $('.quantity-toggle').on('click', 'button', function () {
        const $input = $('.quantity-toggle').find('input[type="number"]');
        const min = Number($input.attr('min')) || 1;
        const max = Number($input.attr('max')) || 10;
        const step = Number($input.attr('step')) || 1;
        const direction = Number($(this).data('step'));

        let value = Number($input.val()) || min;
        value = Math.max(min, Math.min(max, value + direction * step));

        $input.val(value).trigger('change');
      });
    });
  </script>

</body>
</html>
