<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">

  <title>비밀번호찾기 : 아르코예술기록원</title>  

  <meta property="og:title" content="비밀번호찾기 : 아르코예술기록원">
  <meta property="og:description" content="아르코예술기록원, 한국예술디지털아카이브, 한국근현대예술사 구술채록사업, 공연영상화사업, 예술 아카이빙 교육사업, 원 테이블">
  <meta name="description" content="아르코예술기록원, 한국예술디지털아카이브, 한국근현대예술사 구술채록사업, 공연영상화사업, 예술 아카이빙 교육사업, 원 테이블">

  <!-- css -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-gov-dynamic-subset.min.css" />

  <link rel="stylesheet" href="../assets/css/lib/jquery-ui.min.css">
  <link rel="stylesheet" href="../assets/krds/css/common/common.css">
  <link rel="stylesheet" href="../assets/krds/css/component/component.css">
  <link rel="stylesheet" href="../assets/css/arko_common.css">
  
  <!-- js -->
  <script src="../assets/js/lib/jquery.js"></script>
  <script src="../assets/js/lib/jquery-ui.min.js"></script>
  <script src="../assets/krds/js/plugin/swiper-bundle.min.js"></script>
</head>
<body>
  <div id="wrap" class="krds-scaled-layout">
    <div id="headerInclude"><!-- 퍼블전용::상단 영역 include용 --></div>

    <!-- 컨테이너 영역 -->
    <div id="container">
      <div class="contents">
        <div class="arko-breadcrumb">
          <div class="inner">
            <!-- breadcrumb -->
            <nav class="krds-breadcrumb-wrap" aria-label="현재 경로" id="breadcrumb">
              <ol class="breadcrumb">
                <li class="home"><a href="#;" class="txt">홈</a></li>
                <li><a href="#;" class="txt">비밀번호찾기</a></li>
              </ol>
            </nav>
            <!-- breadcrumb -->
          </div>
        </div>

        <!-- 컨텐츠 영역 -->
        <section class="arko-contents">
          <div class="inner">
            <div class="title-area">
              <h1 class="h1-title">비밀번호찾기</h1>
            </div>

            <div class="find-area">
              <ul class="text-list dot">
                <li>새 비밀번호를 입력하시고 비밀번호를 확인해주세요.</li>
              </ul>
              <div class="find-box">
                <div class="row-table-area">
                  <div class="row-table">
                    <dl>
                      <dt>
                        <label for="idInput">아이디</label>
                        <span class="required-mark">*</span>
                        <span class="sr-only">필수</span>
                      </dt>
                      <dd>
                        <input type="text" id="idInput" class="krds-input small" value="abcdefg123" placeholder="" disabled>
                      </dd>
                    </dl>
                    <dl>
                      <dt>
                        <label for="newPwInput">새 비밀번호</label>
                        <span class="required-mark">*</span>
                        <span class="sr-only">필수</span>
                      </dt>
                      <dd>
                        <input type="password" id="newPwInput" class="krds-input small" value="" placeholder="">
                        <p class="mt-xsmall">
                          - 영 대소문자, 숫자, 특수문자 중 3종류 이상으로 총 8글자 이상을 조합하여 입력해주세요.
                        </p>
                      </dd>
                    </dl>
                    <dl>
                      <dt>
                        <label for="newPwCheckInput">비밀번호 확인</label>
                        <span class="required-mark">*</span>
                        <span class="sr-only">필수</span>
                      </dt>
                      <dd>
                        <input type="password" id="newPwCheckInput" class="krds-input small" value="" placeholder="">
                      </dd>
                    </dl>
                  </div>
                </div>
              </div>
            </div>
            <div class="arko-cta-btns">
              <button type="button" class="krds-btn medium primary open-modal" data-target="modalPwChange">확인</button>
            </div>

          </div>          
        </section>
      </div>
      <!-- //컨텐츠 영역 -->
    </div>
    <!-- //컨테이너 영역 -->

    <div id="footerInclude"><!-- 퍼블전용::하단 푸터 include용 --></div>
  </div>

  <!-- modal -->

  <!-- alert -->
  <section id="modalPwChange" class="krds-modal fade" role="dialog" aria-labelledby="tit_modalPwChange">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <!-- modal title -->
        <div class="modal-header">
          <h2 id="tit_modalPwChange" class="modal-title"><span class="sr-only">비밀번호 변경</span></h2>
        </div>
        <!-- //modal title -->
        <!-- modal contents -->
        <div class="modal-conts">
          <div class="conts-area">
            비밀번호가 변경되었습니다.
          </div>
        </div>
        <!-- //modal contents -->
        <!-- modal btn -->
        <div class="modal-btn btn-wrap">
          <button type="button" class="krds-btn medium primary close-modal">확인</button>
        </div>
        <!-- //modal btn -->
        <!-- close button -->
        <!-- <button type="button" class="krds-btn medium icon btn-close close-modal">
          <span class="sr-only">닫기</span>
          <i class="svg-icon ico-popup-close"></i>
        </button> -->
        <!-- //close button -->
      </div>
    </div>
    <div class="modal-back in"></div>
  </section>
  <!-- //modal -->

  <!-- 퍼블전용:: include용 사용금지 -->
  <script src="../guide/js/include.js"></script>

  <!-- UI js -->
  <script src="../assets/krds/js/component/ui-script.js"></script> <!-- krds 제공 스크립트 -->
  <script src="../assets/js/arko-ui-script.js"></script> <!-- arko 전용 ui 스크립트 -->
</body>
</html>
