<body>
  <div class="inner">
    <button type="button" class="krds-btn medium tertiary open-modal" data-target="modalQuotation">
      <i class="svg-icon ico-quote"></i>
      인용하기
    </button>
  </div>

  <!-- modal -->
  <!-- 인용하기 -->
  <section id="modalQuotation" class="krds-modal fade" role="dialog" aria-labelledby="tit_modalQuotation">
    <div class="modal-dialog modal-md">
      <div class="modal-content">
        <!-- modal title -->
        <div class="modal-header">
          <h2 id="tit_modalQuotation" class="modal-title">서지정보 내보내기</h2>
        </div>
        <!-- //modal title -->
        <!-- modal contents -->
        <div class="modal-conts">
          <div class="conts-area">
            <p>선택한 자료에 대한 서지정보를 원하는 방식으로 복사하거나 다운로드할 수 있습니다.</p>

            <h3 class="h3-title">인용형식 선택</h3>
            <div class="form-radio-group">
              <div class="krds-form-check">
                <input type="radio" name="rdo_1" id="rdo_1">
                <label for="rdo_1">기본형</label>
              </div>
              <div class="krds-form-check">
                <input type="radio" name="rdo_1" id="rdo_2">
                <label for="rdo_2">형식2</label>
              </div>
              <div class="krds-form-check">
                <input type="radio" name="rdo_1" id="rdo_3">
                <label for="rdo_3">형식3</label>
              </div>
              <div class="krds-form-check">
                <input type="radio" name="rdo_1" id="rdo_4">
                <label for="rdo_4">형식4</label>
              </div>
            </div>

            <h3 class="h3-title">서지정보 미리보기</h3>
            <div class="preview-area">
              서지정보 미리보기 정보 영역
            </div>
          </div>
        </div>
        <!-- //modal contents -->
        <!-- modal btn -->
        <div class="modal-btn btn-wrap">
          <button type="button" class="krds-btn medium primary close-modal">복사</button>
        </div>
        <!-- //modal btn -->
        <!-- close button -->
        <button type="button" class="krds-btn medium icon btn-close close-modal">
          <span class="sr-only">닫기</span>
          <i class="svg-icon ico-popup-close"></i>
        </button>
        <!-- //close button -->
      </div>
    </div>
    <div class="modal-back in"></div>
  </section>
  <!-- //modal -->


  <!-- 퍼블전용:: include용 사용금지 -->
  <script src="../guide/js/include.js"></script>

  <!-- UI js -->
