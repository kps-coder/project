<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">

  <title>회원가입 : 아르코예술기록원</title>  

  <meta property="og:title" content="회원가입 : 아르코예술기록원">
  <meta property="og:description" content="아르코예술기록원, 한국예술디지털아카이브, 한국근현대예술사 구술채록사업, 공연영상화사업, 예술 아카이빙 교육사업, 원 테이블">
  <meta name="description" content="아르코예술기록원, 한국예술디지털아카이브, 한국근현대예술사 구술채록사업, 공연영상화사업, 예술 아카이빙 교육사업, 원 테이블">

  <!-- css -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-gov-dynamic-subset.min.css" />

  <link rel="stylesheet" href="../assets/css/lib/jquery-ui.min.css">
  <link rel="stylesheet" href="../assets/krds/css/common/common.css">
  <link rel="stylesheet" href="../assets/krds/css/component/component.css">
  <link rel="stylesheet" href="../assets/css/arko_common.css">
  
  <!-- js -->
  <script src="../assets/js/lib/jquery.js"></script>
  <script src="../assets/js/lib/jquery-ui.min.js"></script>
  <script src="../assets/krds/js/plugin/swiper-bundle.min.js"></script>
</head>
<body>
  <div id="wrap" class="krds-scaled-layout">
    <div id="headerInclude"><!-- 퍼블전용::상단 영역 include용 --></div>

    <!-- 컨테이너 영역 -->
    <div id="container">
      <div class="contents">
        <div class="arko-breadcrumb">
          <div class="inner">
            <!-- breadcrumb -->
            <nav class="krds-breadcrumb-wrap" aria-label="현재 경로" id="breadcrumb">
              <ol class="breadcrumb">
                <li class="home"><a href="#;" class="txt">홈</a></li>
                <li><a href="#;" class="txt">회원가입</a></li>
              </ol>
            </nav>
            <!-- breadcrumb -->
          </div>
        </div>

        <!-- 컨텐츠 영역 -->
        <section class="arko-contents">
          <div class="inner">
            <div class="title-area">
              <h1 class="h1-title">회원가입</h1>
            </div>

            <div class="row-table-area">
              <div class="row-table">
                <dl>
                  <dt>
                    <label for="memberJoinName">이름</label>
                    <span class="required-mark">*</span>
                    <span class="sr-only">필수</span>
                  </dt>
                  <dd>
                    <div class="form-group">
                      <div class="form-conts">
                        <input type="text" id="memberJoinName" class="krds-input small" value="이보경" placeholder="">
                      </div>
                    </div>
                  </dd>
                </dl>
                <dl>
                  <dt>
                    <label for="memberJoinId">아이디</label>
                    <span class="required-mark">*</span>
                    <span class="sr-only">필수</span>
                  </dt>
                  <dd>
                    <div class="input-group">
                      <div class="form-conts">
                        <input type="text" id="memberJoinId" class="krds-input small" value="" placeholder="">
                      </div>
                      <button type="button" class="krds-btn small tertiary">중복확인</button>
                    </div>
                    <p class="mt-xsmall">- 아이디는 알파벳 및 아라비아숫자로만 생성이 가능하며, 특수문자 사용 불가합니다.</p>
                  </dd>
                </dl>
                <dl>
                  <dt>
                    <label for="memberJoinPw">비밀번호</label>
                    <span class="required-mark">*</span>
                    <span class="sr-only">필수</span>
                  </dt>
                  <dd>
                    <div class="form-group">
                      <div class="form-conts">
                        <input type="text" id="memberJoinPw" class="krds-input small" value="" placeholder="">
                      </div>
                    </div>
                    <p class="mt-xsmall">- 영 대소문자, 숫자, 특수문자 중 3종류 이상으로 총 8글자 이상을 조합하여 입력해주세요.</p>
                  </dd>
                </dl>
                <dl>
                  <dt>
                    <label for="memberJoinPwCheck">비밀번호 확인</label>
                    <span class="required-mark">*</span>
                    <span class="sr-only">필수</span>
                  </dt>
                  <dd>
                    <div class="form-group">
                      <div class="form-conts">
                        <input type="text" id="memberJoinPwCheck" class="krds-input small" value="" placeholder="">
                      </div>
                    </div>
                  </dd>
                </dl>
                <dl>
                  <dt>
                    <label for="memberJoinAddress">주소</label>
                    <span class="required-mark">*</span>
                    <span class="sr-only">필수</span>
                  </dt>
                  <dd>
                    <div class="form-group group--address">
                      <div class="form-conts form-post">
                        <input type="text" id="memberJoinAddress" class="krds-input small" value="12345" disabled>
                        <button type="button" class="krds-btn tertiary small">주소검색  </button>
                      </div>
                      <div class="form-conts">
                        <input type="text" id="addrInputDetail" class="krds-input small" value="">
                      </div>
                    </div>
                  </dd>
                </dl>
                <dl>
                  <dt>
                    <label for="memberJoinAddressDetail">상세주소</label>
                  </dt>
                  <dd>
                    <div class="form-group">
                      <div class="form-conts">
                        <input type="text" id="memberJoinAddressDetail" class="krds-input small" value="">
                      </div>
                    </div>
                  </dd>
                </dl>
                <dl>
                  <dt>
                    <label for="memberJoinEmail">이메일</label>
                    <span class="required-mark">*</span>
                    <span class="sr-only">필수</span>
                  </dt>
                  <dd>
                    <div class="form-group">
                      <div class="form-conts">
                        <input type="email" id="memberJoinEmail" class="krds-input small" value="">
                      </div>
                    </div>
                  </dd>
                </dl>
                <dl>
                  <dt>
                    <label for="memberJoinTel">전화번호</label>
                    <span class="required-mark">*</span>
                    <span class="sr-only">필수</span>
                  </dt>
                  <dd>
                    <div class="form-group">
                      <div class="form-conts">
                        <input type="tel" id="memberJoinTel" class="krds-input small" value="">
                      </div>
                    </div>
                  </dd>
                </dl>
              </div>
            </div>

            <div class="arko-cta-btns">
              <button type="button" class="krds-btn medium primary">신청</button>
            </div>
          </div>          
        </section>
      </div>
      <!-- //컨텐츠 영역 -->
    </div>
    <!-- //컨테이너 영역 -->

    <div id="footerInclude"><!-- 퍼블전용::하단 푸터 include용 --></div>
  </div>

  <!-- 퍼블전용:: include용 사용금지 -->
  <script src="../guide/js/include.js"></script>

  <!-- UI js -->
  <script src="../assets/krds/js/component/ui-script.js"></script> <!-- krds 제공 스크립트 -->
  <script src="../assets/js/arko-ui-script.js"></script> <!-- arko 전용 ui 스크립트 -->
</body>
</html>
